name: Release
on:
  push:
    branches:
      - main
jobs:
  test-and-verify:
    uses: ./.github/workflows/shared-test.yml
    # A called workflow sees only the secrets it is handed. Explicit rather than `secrets: inherit`,
    # which zizmor's secrets-inherit audit flags. Without these, every main push would build with no
    # remote cache credentials - the one place pushing entries matters most.
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  release:
    needs: [ test-and-verify ]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Remote build cache credentials (settings.gradle.kts): this job's compileKotlin/compileJava
    # match the entries the test-and-verify legs just pushed, and it pushes its own. The checksum
    # variables keep the AWS SDK from sending CRC32 checksums Cloudflare R2 does not implement.
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        id: setup-env
        uses: ./.github/actions/setup-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          skip-searchable-options: 'false'

      - name: Build with Gradle
        id: build-plugin
        run: ./gradlew buildPlugin --no-scan -PpublishChannels=default --stacktrace
