name: 'Setup Build Environment'
description: 'Sets up Java, Elixir, and Gradle for IntelliJ plugin builds. Version inputs left empty are resolved from .github/ci-versions.json, so the repository must be checked out before calling this action.'

# Note, can't do type hinting in composite actions yet...
inputs:
  elixir-version:
    description: 'Elixir version. Empty resolves to beam.baseline.elixir in .github/ci-versions.json.'
    required: false
    default: ''
  otp-version:
    description: 'OTP version. Empty resolves to beam.baseline.otp in .github/ci-versions.json.'
    required: false
    default: ''
  idea-version:
    description: 'IntelliJ IDEA platform version to build/test against. Empty resolves to idea.minimumSupported.version in .github/ci-versions.json (which matches pluginSinceBuild), so release/tag builds get the minimum supported platform for free; override per-leg to test against a newer platform (see the test-matrix job in shared-test.yml).'
    required: false
    default: ''
  java-version:
    description: 'JBR major version to install. Must match the Java level of idea-version: 25 for 2026.2+ (build 262), 21 for earlier. Empty resolves to the java declared for idea-version in .github/ci-versions.json.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for API access (required for setup-java to download JBR)'
    required: true
  build-scan-publish:
    description: 'Whether to publish Gradle build scans'
    required: false
    default: 'false'
  setup-elixir:
    description: 'If true, install the Elixir/OTP toolchain (erlef/setup-beam). Not needed for the verify-plugin job.'
    required: false
    default: 'true'
  skip-searchable-options:
    description: 'Skip building searchable options (faster builds, but users cannot search settings). Use false for release builds.'
    required: false
    default: 'true'
  free-docker-images:
    description: 'Remove Docker images during disk space cleanup. Set to false when later steps use Docker container actions.'
    required: false
    default: 'true'
  gradle-encryption-key:
    description: |
      Base64 AES key (`openssl rand -base64 16`, stored as the GRADLE_ENCRYPTION_KEY secret) without
      which gradle/actions caches no configuration-cache data. A composite action cannot read
      `secrets`, so callers pass it; empty - as on fork pull requests - skips only that data.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Any version input left empty is resolved from the CI declaration, so callers that don't care
    # (release/tag/build-plugin) always get the minimum supported platform and its JBR level
    # without restating it. The test matrix passes every value explicitly, so its legs read neither
    # the file nor anything but their own inputs. Must run before the JBR cache restore, which keys
    # on java-version.
    #
    # Two things the caller has to get right: the repository must already be checked out, since this
    # reads a file from it, and the checkout must include .github/scripts as well as the declaration.
    # A caller that checks out sparsely and omits either gets "Cannot find module" or the resolver's
    # own "not found" error, both before any version is known.
    - name: Resolve versions
      id: resolve
      shell: bash
      env:
        IDEA_VERSION: ${{ inputs.idea-version }}
        JAVA_VERSION: ${{ inputs.java-version }}
        ELIXIR_VERSION: ${{ inputs.elixir-version }}
        OTP_VERSION: ${{ inputs.otp-version }}
        SETUP_ELIXIR: ${{ inputs.setup-elixir }}
      run: node .github/scripts/resolve-versions.js

    - name: Free Disk Space
      id: free-disk-space
      ## Windows runners appear to have plenty of free space on D:
      ## and this action doesn't work on Windows.
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: false
        large-packages: false
        docker-images: ${{ inputs.free-docker-images == 'true' }}

    # Keyed on the JBR major version so matrix legs on different Java levels (21 vs 25)
    # cannot restore each other's runtime. No prefix restore-keys on purpose: a partial
    # restore would be re-saved as a combined blob that grows with every version.
    - name: Restore JetBrains Runtime cache
      id: cache-jbr
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.tool_cache }}/Java_JetBrains_*
        key: jbr-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.java-version }}

    - name: Setup JBR
      id: setup-java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: 'jetbrains'
        java-version: ${{ steps.resolve.outputs.java-version }}
        java-package: 'jdk'
        token: ${{ inputs.github-token }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Save JetBrains Runtime cache
      id: cache-jbr-save
      if: always() && steps.cache-jbr.outputs.cache-hit != 'true' && steps.setup-java.outcome == 'success'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.tool_cache }}/Java_JetBrains_*
        key: ${{ steps.cache-jbr.outputs.cache-primary-key }}

    # This sets project properties, allowing us to override gradle.properties via environment variables,
    # applying to all Gradle tasks. Means we don't need to do like `./gradlew -PplatformVersion=xxx`
    # Needed because we can't just use env, as we're in a composite action, and env set here won't propagate to
    # later steps in the workflow that use this action.
    # https://docs.gradle.org/current/userguide/build_environment.html#setting_a_project_property
    #
    # We could use https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-faq.html#how-to-check-the-latest-available-eap-release , but
    # it's wrong and doesn't actually work?
    # See also https://github.com/JetBrains/intellij-platform-gradle-plugin/issues/1628
    #
    # We want to find the latest "public" EAP, also called [nextversion](https://www.jetbrains.com/idea/nextversion/)
    - name: Export Environment Variables
      id: export-environment-variables
      shell: bash
      env:
        IDEA_VERSION: ${{ steps.resolve.outputs.idea-version }}
        SKIP_SEARCHABLE_OPTIONS: ${{ inputs.skip-searchable-options }}
      run: |
        if [ "$IDEA_VERSION" = "LATEST-EAP-SNAPSHOT" ]; then
          # Use VersionFetcher to resolve the actual EAP version
          echo "ORG_GRADLE_PROJECT_useDynamicEapVersion=true" >> $GITHUB_ENV
        elif [ -n "$IDEA_VERSION" ]; then
          echo "ORG_GRADLE_PROJECT_platformVersion=$IDEA_VERSION" >> $GITHUB_ENV
        fi
        echo "ORG_GRADLE_PROJECT_skipSearchableOptions=$SKIP_SEARCHABLE_OPTIONS" >> $GITHUB_ENV

    # The excluded dirs are the expensive, worthless half: a build scan measured the whole 1.4 GiB
    # download at 15 s, and the Gradle-home cache is keyed per job, so caching it across 13 jobs
    # would exhaust the 10 GB limit on its own. What is left is the build cache - 11.9 MiB, and 0 of
    # 229 work units hit before this. Excludes filter the Gradle User Home only, so they cannot
    # affect the configuration-cache data that cache-encryption-key covers. cache-read-only keeps
    # its default, which writes only from the default branch.
    - name: Setup Gradle
      id: setup-gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: false
        # `caches/<gradle-version>/transforms` on Gradle 9, not `caches/transforms-*`.
        gradle-home-cache-excludes: |
          caches/modules-2
          caches/*/transforms
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}
        # avoid async in shutdown until https://github.com/nodejs/node/pull/61999 lands in the action runner's JS version.
        add-job-summary-as-pr-comment: 'never'
        build-scan-publish: ${{ inputs.build-scan-publish }}
        build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
        build-scan-terms-of-use-agree: 'yes'
        github-token: ${{ inputs.github-token }}

    - name: Setup Elixir
      id: setup-elixir
      if: ${{ inputs.setup-elixir == 'true' }}
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: ${{ steps.resolve.outputs.otp-version }}
        elixir-version: ${{ steps.resolve.outputs.elixir-version }}

    - name: Export Elixir Environment Variables
      id: export-elixir-environment-variables
      if: ${{ inputs.setup-elixir == 'true' && steps.resolve.outputs.elixir-version != '' }}
      shell: bash
      run: |
        echo "OTP_RELEASE=${{ steps.resolve.outputs.otp-version }}" >> $GITHUB_ENV
        echo "ERLANG_SDK_HOME=$(erl -eval 'io:format("~s", [code:root_dir()]).' -noshell -run init stop)" >> $GITHUB_ENV

