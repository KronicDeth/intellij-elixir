# =============================================================================
# Version Catalog
# Purpose: Centralizes dependency and plugin versions to improve maintenance.
# Usage: Access in build scripts via 'libs.versions.x' or 'libs.plugins.x'.
# See: https://plugins.jetbrains.com/docs/intellij/using-kotlin.html#stdlib-miscellaneous
# =============================================================================

[versions]
# Pinned packages, due to IntelliJ Platform version requirements.
# We must be on the exact versions they recommend, depending on which minimum version of IntelliJ we support.

# https://plugins.jetbrains.com/docs/intellij/using-kotlin.html#kotlin-standard-library
# This is the Kotlin Gradle Plugin / compiler version we build with - it does NOT need to match
# the lowest supported platform's bundled stdlib. That floor (2025.3 -> stdlib 2.2.20, per
# .github/ci-versions.json's minimumSupported / pluginSinceBuild=253.28294.1) is enforced
# separately and independently by apiVersion = KotlinVersion.KOTLIN_2_2 below, which restricts
# which stdlib declarations our source may reference (by @SinceKotlin) regardless of which literal
# stdlib jar this compiler resolves locally. languageVersion (source syntax) is left unset here and
# defaults to match this compiler version - lowering this pin would silently lower languageVersion
# too and can break valid source using newer syntax, with no stdlib-compliance benefit.
# kotlin.stdlib.default.dependency = false must be set in gradle.properties
kotlin = "2.3.20"

# Unpinned/non-stdlib bundled packages
intellij-platform = "2.18.1"
gradle-download = "5.7.0"
test-logger = "4.0.0"
versions = "0.61.0"
changelog = "2.5.0"

# Dependency Versions
commons-io = "2.22.0"
junit = "4.13.2"
opentest4j = "1.3.0"
mockito-core = "5.23.0"
kodein = "7.32.0"
kotlinx-coroutines = "1.11.0"

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html#platformVersions
# 2026.1 (261.x) requires Java 21.
java = "21"

[libraries]
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
junit = { module = "junit:junit", version.ref = "junit" }
# No version: resolves to whatever the IntelliJ test-framework-junit5/ide-starter artifacts request,
# so the Jupiter API/engine always matches what JetBrains compiled the Starter framework against.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito-core" }
kodein-di-jvm = { module = "org.kodein.di:kodein-di-jvm", version.ref = "kodein" }
kotlinx-coroutines-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlinx-coroutines" }

[plugins]
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
download = { id = "de.undercouch.download", version.ref = "gradle-download" }
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions" }
