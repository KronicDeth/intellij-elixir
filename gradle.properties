# --- Tooling Versions ---
# The Elixir/Erlang the build targets are NOT declared here - mise.toml is the pin, and the build asks
# mise for the effective version. Override per-invocation with -PelixirVersion / -PotpVersion.

# Quoter source (the intellij_elixir project compiled/run to produce reference ASTs).
# quoterRepo: GitHub <owner>/<repo>. quoterRef: a tag (e.g. v2.1.0) or branch archive ref
# (e.g. refs/heads/my-branch). Override to test a fork/branch, e.g.:
#   -PquoterRepo=sh41/intellij_elixir -PquoterRef=refs/heads/fix/elixir-1.13-deprecation-warnings
# The download/build cache is namespaced by a slug of quoterRef (slashes -> dashes), so switching
# repo/ref fetches and builds into its own cache dir automatically. (A moving branch keeps the same
# slug, so delete cache/intellij_elixir-<slug>.zip to force a re-fetch after new branch commits.)
quoterRepo=KronicDeth/intellij_elixir
quoterRef=v2.1.0
#quoterRepo=sh41/intellij_elixir
#quoterRef=refs/heads/fix/elixir-1.13-deprecation-warnings

# Plugins which will run ONLY when running `runIde` tasks, not for testing/release.
#
# Usage:
# When using `./gradlew runIde`, pass the Gradle Property:
# -PrunIdeCompatiblePlugins="PsiViewer,com.google.ide-perf,org.jetbrains.action-tracker,com.intellij.classic.ui,krasa.CpuUsageIndicator,IdeaVIM"
#
# Recommendations:
# https://plugins.jetbrains.com/plugin/24468-classic-ui - Classic UI (old UI)
# https://plugins.jetbrains.com/plugin/7641-action-tracker - Action Tracker (Allows to record actions performed by user in IntelliJ IDEs)
# https://plugins.jetbrains.com/plugin/15104-ide-perf - IDE Performance
# https://plugins.jetbrains.com/plugin/227-psiviewer - PSI Viewer (A Program Structure Interface (PSI) tree viewer)
# IdeaVIM
runIdeCompatiblePlugins=

# Note: intelliLang changed to a module (intellij.platform.langInjection) in 2025.3+
platformBundledPlugins=org.intellij.plugins.markdown,com.intellij.java
platformBundledModules=intellij.platform.langInjection,intellij.spellchecker

# Disable automatic plugin reloading in runIde; re-enable with -PideaAutoReload=true if needed.
ideaAutoReload=false

# Exclude bundled plugins whose initializers crash or spam warnings in headless test runs from the
# test classpath. The released 2.18.1 plugin only excludes openRewrite + ja/ko/zh by default; the
# vue exclusion (JetBrains/intellij-platform-gradle-plugin#2183) is not yet in a published release.
# This property REPLACES the default list, so it must repeat the defaults.
# Warning-noise exclusions (all WARN-level, none affect test results):
#   com.intellij.configurationScript    - ProjectStoreFactory override rejected (InstanceNotOverridableException)
#   com.jetbrains.remoteDevelopment     - RemoteModCommandExecutor override rejected (InstanceNotOverridableException)
#   org.jetbrains.plugins.docker.gateway - SLF4J provider fails to instantiate in headless JVM
#   com.intellij.platform.daemon        - competing SLF4J provider (Slf4jToDaemonServiceProvider)
#   JavaScript                          - JSPluginPathManager cannot find jsLanguageServicesImpl resources
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=\
  com.intellij.openRewrite,\
  com.intellij.ja,\
  com.intellij.ko,\
  com.intellij.zh,\
  org.jetbrains.plugins.vue,\
  com.intellij.configurationScript,\
  com.jetbrains.remoteDevelopment,\
  org.jetbrains.plugins.docker.gateway,\
  com.intellij.platform.daemon,\
  JavaScript

# --- Gradle Performance & Memory ---
org.gradle.jvmargs=-Xmx4096m
kotlin.daemon.jvmargs=-Xmx4906m

# --- Dependency download retries ---
# Widens a budget Gradle already applies to repository 5xx; it does not switch retrying on. Four
# properties because two layers implement it independently: max.tentatives
# (ErrorHandlingModuleComponentRepository) and max.attempts (NetworkOperationBackOffAndRetry). Both
# read with Integer.getInteger, hence systemProp - a bare org.gradle.internal.* line is ignored.
#
# The value is ATTEMPTS, not retries, and the backoff doubles: total wait is
# 3000*(2^(attempts-1) - 1) ms, so an unrecoverable download costs ~6.4 min per Gradle invocation.
# Check that against the test legs' timeout-minutes if you raise either.
#
# Editing this file re-primes the Elixir quoter cache: hashFiles('gradle.properties') is in its key.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=3000
systemProp.org.gradle.internal.network.retry.max.attempts=8
systemProp.org.gradle.internal.network.retry.initial.backOff=3000

# @todo Once this has been tested to be stable with the intellij-elixir codebase, enable.
# Others have it on without issues, so I'm not overly worried - just want to confirm stability.
# Can always just turn it off for CI.
# Before this, we need to upgrade download and fix the outputs for the tasks to ensure they cache.
# Gradle Configuration Cache - https://docs.gradle.org/current/userguide/configuration_cache.html
# Gradle Build Cache - https://docs.gradle.org/current/userguide/build_cache.html
# Parallel Gradle Builds - https://docs.gradle.org/current/userguide/performance.html#parallel_execution
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
#org.gradle.daemon=false
# - Kotlin stdlib dependency conflict The Kotlin Standard Library (stdlib) is automatically added by the Gradle Kotlin
#     plugin and may conflict with the version bundled in IntelliJ Platform. This can cause ClassNotFoundException or
#     version mismatch issues at runtime. Exclude the Kotlin stdlib dependency by setting
#     'kotlin.stdlib.default.dependency=false' in gradle.properties.
#     See: https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
