# =============================================================================
# Build Configuration Properties
# Purpose: Defines project constants, platform targets, and JVM settings.
# =============================================================================

# --- Plugin Metadata ---
pluginGroup=org.elixir_lang
pluginName=Elixir
pluginVersion=24.0.0
pluginRepositoryUrl=https://github.com/KronicDeth/intellij-elixir/
vendorName=Kadie Enheduanna Inanna
vendorEmail=Kronic.Deth@gmail.com
pluginSinceBuild=253.28294.1
publishChannels=canary

# --- Changelog ---
# CHANGELOG.md is in Keep a Changelog format and is the single source of the plugin's change notes.
# Declared here rather than in build.gradle.kts because two consumers read them: the build, and the
# per-pull-request check in .github/workflows/changelog.yml - which can parse a properties file
# without regexing Kotlin source.
#
# changelogGroups is the full section vocabulary, in the order patchChangelog scaffolds them into a
# new Unreleased block. Comma-separated, so a group name may not contain a comma.
changelogGroups=Breaking changes,Enhancements,Bug Fixes,Threading / Platform Hygiene,Build / CI
# Which of those reach the Marketplace "What's New". Must be a subset of changelogGroups; the build
# fails if it is not. Everything else is recorded for contributors but says nothing a user observes.
# Breaking changes belongs here: it is the entry a reader most needs, and a version whose only group
# is unpublished renders empty and is dropped from the panel entirely.
changelogPublishedGroups=Breaking changes,Enhancements,Bug Fixes
# How many versions the "What's New" lists: the one being built plus the five before it.
changelogPublishedVersions=6

# Set to True to skip building searchable options, if developing this drastically speeds up build times.
# See https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin-faq.html#how-to-disable-building-searchable-options
skipSearchableOptions=false

